# 托孤(bequest)服务器发布工作流
# 推送 vX.Y.Z 标签(如 v1.0.0)时:
#   1. build   交叉编译 5 个平台二进制
#   2. docker  构建并推送多架构镜像到 ghcr.io/muxinxy/bequest
#   3. release 发布 GitHub Release 并附带二进制产物
#   4. android 构建 Flutter APK(arm64-v8a/armeabi-v7a/x86_64)
# 也可手动触发(workflow_dispatch), 此时版本为 dev, 仅构建+发布镜像(不推送 release 产物)。
name: release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: 交叉编译二进制
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: 确定版本号
        id: version
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          if [ "$REF" = "$GITHUB_REF" ]; then
            echo "version=dev" >> "$GITHUB_OUTPUT"
          else
            echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: 交叉编译
        run: |
          chmod +x scripts/build.sh
          VERSION="${{ steps.version.outputs.version }}" ./scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: bequest-binaries
          path: dist/*
          if-no-files-found: error

  docker:
    name: 构建并推送 Docker 镜像
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 构建 Flutter Web 客户端
        run: cd app && flutter pub get && flutter build web

      - uses: docker/setup-buildx-action@v3

      - name: 确定版本号
        id: version
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          if [ "$REF" = "$GITHUB_REF" ]; then
            echo "version=dev" >> "$GITHUB_OUTPUT"
          else
            echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/muxinxy/bequest
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}

  # 构建 Flutter Android APK(按 ABI 拆分), 产物供 release 发布
  android:
    name: 构建 Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 确定版本号
        id: version
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          if [ "$REF" = "$GITHUB_REF" ]; then
            echo "version=dev" >> "$GITHUB_OUTPUT"
          else
            echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: 安装依赖
        run: cd app && flutter pub get

      # 从 GitHub Secrets 还原 release keystore 与 key.properties(不落日志, 不提交仓库)
      - name: 配置 release 签名
        run: |
          mkdir -p app/android
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/android/bequest-release.jks
          printf 'storeFile=bequest-release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.KEYSTORE_PASSWORD }}" "${{ secrets.KEY_ALIAS }}" "${{ secrets.KEY_PASSWORD }}" \
            > app/android/key.properties
          ls -l app/android/bequest-release.jks app/android/key.properties

      - name: 构建 APK
        run: cd app && flutter build apk --release --split-per-abi

      - name: 汇总 APK
        run: |
          mkdir -p android-dist
          VERSION="${{ steps.version.outputs.version }}"
          for src in app/build/app/outputs/flutter-apk/app-*-release.apk; do
            [ -e "$src" ] || continue
            abi="$(basename "$src" | sed -E 's/^app-(.*)-release\.apk$/\1/')"
            cp "$src" "android-dist/bequest-v${VERSION}-${abi}.apk"
          done
          ls -l android-dist/

      - uses: actions/upload-artifact@v4
        with:
          name: bequest-android
          path: android-dist/*
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bequest-binaries
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: bequest-android
          path: android-dist

      - name: 提取更新说明
        id: changelog
        run: |
          VERSION="${GITHUB_REF#refs/tags/v}"
          # 提取 CHANGELOG.md 中 "## v<版本> " 到下一个 "## " 之间的内容作为发布说明
          awk -v v="v$VERSION" '
            $0 ~ "^## " v " " { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release_body.md
          # 无手动说明时给出占位提示(仍会附加 GitHub 自动生成的提交记录)
          if [ ! -s release_body.md ]; then
            printf '本版本暂无手动更新说明,详见下方自动生成的提交记录。\n' > release_body.md
          fi
          echo "body_lines=$(wc -l < release_body.md)"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            android-dist/*
          draft: false
          generate_release_notes: true
          body_path: release_body.md
