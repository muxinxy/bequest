# 托孤(bequest)服务器发布工作流
# 推送 vX.Y.Z 标签(如 v1.0.0)时:
#   1. build   交叉编译 5 个平台二进制
#   2. docker  构建并推送多架构镜像到 ghcr.io/muxinxy/bequest
#   3. release 发布 GitHub Release 并附带二进制产物
#   4. android 构建 Flutter APK(arm64-v8a/armeabi-v7a/x86_64)
# 也可手动触发(workflow_dispatch), 此时版本为 dev, 仅构建+发布镜像(不推送 release 产物)。
name: release

"on":
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: 交叉编译二进制
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache: true

      - name: 确定版本号
        id: version
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          if [ "$REF" = "$GITHUB_REF" ]; then
            echo "version=dev" >> "$GITHUB_OUTPUT"
          else
            echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
          fi

      - name: 交叉编译
        run: |
          chmod +x scripts/build.sh
          VERSION="${{ steps.version.outputs.version }}" ./scripts/build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: bequest-binaries
          path: dist/*
          if-no-files-found: error

  docker:
    name: 构建并推送 Docker 镜像
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 确定版本号
        id: version
        run: |
          REF="${GITHUB_REF#refs/tags/}"
          if [ "$REF" = "$GITHUB_REF" ]; then
            echo "version=dev" >> "$GITHUB_OUTPUT"
          else
            echo "version=${REF#v}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/muxinxy/bequest
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.version.outputs.version }}

  # 构建 Flutter Android APK(按 ABI 拆分), 产物供 release 发布
  android:
    name: 构建 Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 安装依赖
        run: cd app && flutter pub get

      - name: 构建 APK
        run: cd app && flutter build apk --release --split-per-abi

      - name: 汇总 APK
        run: |
          mkdir -p android-dist
          cp app/build/app/outputs/flutter-apk/*.apk android-dist/

      - uses: actions/upload-artifact@v4
        with:
          name: bequest-android
          path: android-dist/*
          if-no-files-found: error

  release:
    name: 发布 GitHub Release
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: bequest-binaries
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: bequest-android
          path: android-dist

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            android-dist/*
          draft: false
          generate_release_notes: true
