<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bequest Admin · 管理后台</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #eef2f7;
    --card: #ffffff;
    --border: #e3e8ef;
    --text: #1f2430;
    --muted: #6b7280;
    --brand: #4f46e5;
    --brand2: #7c3aed;
    --radius: 12px;
    --shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 24px -12px rgba(16,24,40,.12);
    --shadow-lg: 0 12px 32px -12px rgba(16,24,40,.18);
  }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    background: linear-gradient(180deg, #eef2f7 0%, #e5ebf3 100%);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    background: linear-gradient(90deg, #0f172a 0%, #1e1b4b 100%);
    color: #fff; padding: 0 24px; height: 56px;
    display: flex; align-items: center; gap: 20px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.06), 0 4px 16px -8px rgba(0,0,0,.4);
    position: sticky; top: 0; z-index: 20;
  }
  header .logo { display: flex; align-items: center; gap: 10px; }
  header .logo svg { width: 22px; height: 22px; color: #a5b4fc; }
  header h1 { font-size: 16px; font-weight: 600; letter-spacing: .2px; }
  header nav { display: flex; gap: 4px; }
  header nav button {
    background: none; border: none; color: #a5b0c0; padding: 8px 14px; font-size: 14px;
    cursor: pointer; border-radius: 8px;
    transition: background .18s ease, color .18s ease;
  }
  header nav button:hover { background: rgba(255,255,255,.08); color: #fff; }
  header nav button.active {
    background: linear-gradient(135deg, #6366f1, #8b5cf6); color: #fff;
    box-shadow: 0 4px 12px -4px rgba(99,102,241,.6);
  }
  header .spacer { flex: 1; }
  header .who { color: #a5b0c0; font-size: 13px; }
  .lang-switch { display: inline-flex; align-items: center; border: 1px solid rgba(255,255,255,.18); border-radius: 8px; overflow: hidden; }
  .lang-switch button {
    background: none; border: none; color: #a5b0c0; padding: 6px 10px; font-size: 12px;
    cursor: pointer; border-radius: 0; line-height: 1; box-shadow: none; min-width: 46px;
  }
  .lang-switch button:hover { background: rgba(255,255,255,.14); color: #fff; border-color: transparent; }
  .lang-switch button.active { background: rgba(255,255,255,.22); color: #fff; }
  header .logout {
    background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.18); color: #dbe2ec;
    border-radius: 8px; padding: 6px 14px; font-size: 13px; cursor: pointer;
    transition: background .18s ease;
  }
  header .logout:hover { background: rgba(255,255,255,.14); }
  main { max-width: 1200px; margin: 28px auto; padding: 0 24px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 24px; margin-bottom: 20px; box-shadow: var(--shadow);
  }
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 16px; }
  .stat {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 18px 18px 18px 20px; position: relative; overflow: hidden;
    box-shadow: var(--shadow);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  .stat::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
  .stat:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
  .stat .n { font-size: 28px; font-weight: 800; letter-spacing: -.5px; }
  .stat .l { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .stat:nth-child(1)::before { background: #6366f1; } .stat:nth-child(1) .n { color: #4f46e5; }
  .stat:nth-child(2)::before { background: #0ea5e9; } .stat:nth-child(2) .n { color: #0284c7; }
  .stat:nth-child(3)::before { background: #8b5cf6; } .stat:nth-child(3) .n { color: #7c3aed; }
  .stat:nth-child(4)::before { background: #f59e0b; } .stat:nth-child(4) .n { color: #d97706; }
  .stat:nth-child(5)::before { background: #10b981; } .stat:nth-child(5) .n { color: #059669; }
  .stat:nth-child(6)::before { background: #ec4899; } .stat:nth-child(6) .n { color: #db2777; }
  .stat:nth-child(7)::before { background: #f43f5e; } .stat:nth-child(7) .n { color: #e11d48; }
  .stat:nth-child(8)::before { background: #14b8a6; } .stat:nth-child(8) .n { color: #0d9488; }
  .stat:nth-child(9)::before { background: #f97316; } .stat:nth-child(9) .n { color: #ea580c; }
  table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
  th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid #eef1f6; }
  thead th {
    color: #5b6472; font-weight: 600; background: #f4f6fa; font-size: 12px;
    text-transform: uppercase; letter-spacing: .4px;
  }
  thead th:first-child { border-top-left-radius: 10px; }
  thead th:last-child { border-top-right-radius: 10px; }
  tbody tr { transition: background .12s ease; }
  tbody tr:hover td { background: #f6f8fc; }
  tbody tr:last-child td { border-bottom: none; }
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px; font-weight: 500; }
  .badge.member { background: rgba(14,165,233,.12); color: #0369a1; }
  .badge.free { background: rgba(107,114,128,.12); color: #4b5563; }
  .badge.admin { background: rgba(244,63,94,.12); color: #be123c; }
  .badge.user { background: rgba(107,114,128,.12); color: #4b5563; }
  .badge.on { background: rgba(16,185,129,.14); color: #047857; }
  .badge.off { background: rgba(244,63,94,.12); color: #be123c; }
  button {
    font-size: 13px; padding: 6px 14px; border-radius: 8px; border: 1px solid #d7dce4;
    background: #fff; color: #374151; cursor: pointer;
    box-shadow: 0 1px 2px rgba(16,24,40,.04);
    transition: background .15s ease, border-color .15s ease, transform .1s ease;
  }
  button:hover { background: #f3f5f9; border-color: #c6cdd8; }
  button:active { transform: translateY(1px); }
  button.primary {
    background: linear-gradient(135deg, #4f46e5, #7c3aed); border-color: transparent; color: #fff;
    box-shadow: 0 4px 12px -4px rgba(79,70,229,.5);
  }
  button.primary:hover { background: linear-gradient(135deg, #4338ca, #6d28d9); }
  button.danger { color: #be123c; border-color: #fecdd3; background: #fff; }
  button.danger:hover { background: #fff1f2; border-color: #fda4af; }
  button:disabled { opacity: .5; cursor: not-allowed; box-shadow: none; transform: none; }
  input, select {
    font-size: 13px; padding: 7px 10px; border: 1px solid #d7dce4; border-radius: 8px;
    background: #fff; color: var(--text);
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input:focus, select:focus {
    outline: none; border-color: #6366f1;
    box-shadow: 0 0 0 3px rgba(99,102,241,.18);
  }
  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  .toolbar input[type=text] { width: 240px; }
  .pager { display: flex; gap: 10px; align-items: center; margin-top: 16px; font-size: 13px; color: var(--muted); }
  .pager button { border-radius: 999px; padding: 6px 16px; }
  .msg {
    position: fixed; top: 68px; right: 20px; padding: 11px 18px; border-radius: 10px; color: #fff;
    font-size: 13px; z-index: 30; opacity: 0; transform: translateY(-6px);
    box-shadow: var(--shadow-lg);
    transition: opacity .2s, transform .2s;
  }
  .msg.show { opacity: 1; transform: translateY(0); }
  .msg.ok { background: linear-gradient(135deg, #059669, #10b981); }
  .msg.err { background: linear-gradient(135deg, #dc2626, #f43f5e); }
  .form-row { display: flex; gap: 8px; margin-bottom: 10px; align-items: center; flex-wrap: wrap; }
  .form-row label { font-size: 13px; color: var(--muted); width: 110px; }
  .sm { width: 60px; } .md { width: 120px; }
  .subcard {
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow);
  }
  .subcard-title {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 700; color: var(--text);
    padding-bottom: 10px; margin-bottom: 12px; border-bottom: 1px solid #eef1f6;
  }
  .subcard-title svg { width: 16px; height: 16px; color: var(--brand); flex-shrink: 0; }
  .subcard .tag {
    margin-left: auto; padding: 2px 8px; border-radius: 999px;
    font-size: 11px; font-weight: 600; letter-spacing: .3px;
    background: rgba(107,114,128,.1); color: var(--muted); white-space: nowrap;
  }
  .subcard .form-row:last-child { margin-bottom: 0; }
  .save-bar { display: flex; justify-content: flex-end; margin-bottom: 16px; }
  .save-bar button.primary {
    padding: 10px 32px; font-size: 14px; font-weight: 600; border-radius: 10px;
    box-shadow: 0 4px 14px -4px rgba(79,70,229,.55);
  }
  .login-wrap {
    max-width: 380px; margin: 120px auto; background: var(--card);
    border: 1px solid var(--border); border-radius: 16px; padding: 32px;
    box-shadow: 0 0 0 1px rgba(99,102,241,.08), 0 24px 60px -20px rgba(16,24,40,.25);
    position: relative;
  }
  .login-wrap::before {
    content: ""; position: absolute; inset: 0; border-radius: 16px; padding: 1px;
    background: linear-gradient(135deg, #6366f1, #8b5cf6, #ec4899);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor; mask-composite: exclude;
    pointer-events: none;
  }
  .login-wrap h2 { font-size: 18px; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
  .login-wrap h2 svg { width: 20px; height: 20px; color: #6366f1; }
  .login-wrap .form-row label { width: 64px; }
  .login-wrap input { width: 100%; }
  .login-wrap button { width: 100%; margin-top: 14px; padding: 10px; font-size: 14px; }
  .hidden { display: none; }
  .muted { color: var(--muted); font-size: 12px; }
  @media (max-width: 640px) {
    header { padding: 0 14px; gap: 12px; }
    header nav button { padding: 8px 10px; }
    main { padding: 0 14px; }
    .cards { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  }
</style>
</head>
<body>
<header id="appbar" class="hidden">
  <div class="logo">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
    <h1 data-i18n="appTitle">托孤 · 管理后台</h1>
  </div>
  <nav id="tabs">
    <button data-tab="dash" class="active" data-i18n="tabDash">仪表盘</button>
    <button data-tab="users" data-i18n="tabUsers">用户</button>
    <button data-tab="config" data-i18n="tabConfig">系统配置</button>
    <button data-tab="codes" data-i18n="tabCodes">兑换码</button>
    <button data-tab="audit" data-i18n="tabAudit">审计日志</button>
    <button data-tab="about" data-i18n="tabAbout">关于</button>
  </nav>
  <div class="spacer"></div>
  <span class="who" id="who"></span>
  <div class="lang-switch">
    <button id="lang-zh" class="active" type="button">中文</button>
    <button id="lang-en" type="button">English</button>
  </div>
  <button class="logout" id="logout" data-i18n="logout">退出登录</button>
</header>
<div id="msg" class="msg"></div>

<main id="login-view" class="login-wrap">
  <div id="lg-form">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg><span data-i18n="loginTitle">管理后台登录</span></h2>
    <div class="form-row"><label data-i18n="labelUsername">账号</label><input id="lg-user" autocomplete="username"></div>
    <div class="form-row"><label data-i18n="labelPassword">密码</label><input id="lg-pass" type="password" autocomplete="current-password"></div>
    <div class="form-row"><label data-i18n="labelCaptcha">验证码</label><span id="lg-question" class="muted" style="cursor:pointer" title="点击刷新验证码" data-i18n-title="captchaTip" onclick="loadCaptcha()"></span></div>
    <div class="form-row"><label></label><input id="lg-captcha" placeholder="输入图中字符" data-i18n-ph="captchaPh" style="width:140px"></div>
    <button class="primary" id="lg-btn" data-i18n="loginBtn">登 录</button>
  </div>
  <div id="lg-2fa" class="hidden">
    <h2><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg><span data-i18n="login2faTitle">两步验证</span></h2>
    <div class="form-row"><label data-i18n="label2faCode">动态码</label><input id="lg-totp" inputmode="numeric" maxlength="6" placeholder="6 位数字" data-i18n-ph="totpPh" style="width:140px"></div>
    <button class="primary" id="lg-2fa-btn" data-i18n="verifyBtn">验 证</button>
  </div>
</main>

<main id="app" class="hidden">
  <section id="tab-dash" class="card">
    <div class="cards" id="stats"></div>
  </section>

  <section id="tab-users" class="card hidden">
    <div class="toolbar">
      <input id="u-q" type="text" placeholder="搜索用户名 / 邮箱" data-i18n-ph="searchUserPh">
      <select id="u-role">
        <option value="" data-i18n="optAllRoles">全部角色</option><option value="admin" data-i18n="bAdmin">管理员</option><option value="user" data-i18n="optRoleUser">普通用户</option>
      </select>
      <select id="u-tier">
        <option value="" data-i18n="optAllTiers">全部等级</option><option value="member" data-i18n="bMember">会员</option><option value="free" data-i18n="bFree">免费</option>
      </select>
      <button class="primary" id="u-search" data-i18n="searchBtn">搜索</button>
    </div>
    <table>
      <thead><tr><th data-i18n="thId">ID</th><th data-i18n="thUsername">用户名</th><th data-i18n="thEmail">邮箱</th><th data-i18n="thTier">等级</th><th data-i18n="thExpiry">会员到期</th><th data-i18n="thRole">角色</th><th data-i18n="thStatus">状态</th><th data-i18n="thAssets">资产</th><th data-i18n="thHeir">继承人</th><th data-i18n="thLastLogin">最后登录</th><th data-i18n="thRegTime">注册时间</th><th data-i18n="thActions">操作</th></tr></thead>
      <tbody id="u-body"></tbody>
    </table>
    <div class="pager">
      <button id="u-prev" data-i18n="prevPage">上一页</button><span id="u-info"></span><button id="u-next" data-i18n="nextPage">下一页</button>
    </div>
  </section>

  <section id="tab-config" class="card hidden">
    <div class="subcard">
      <div class="subcard-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M22 6l-10 7L2 6"/></svg>
        <span data-i18n="cfgSmtpTitle">发件服务器 (SMTP)</span>
        <span class="tag" data-i18n="tagRoundRobin">轮询负载均衡</span>
      </div>
      <div id="smtp-rows"></div>
      <button id="smtp-add" data-i18n="addServer">+ 添加服务器</button>
    </div>

    <div class="subcard">
      <div class="subcard-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span data-i18n="cfgSmsTitle">短信服务商</span>
        <span class="tag" data-i18n="tagReserved">预留</span>
      </div>
      <div id="sms-rows"></div>
      <button id="sms-add" data-i18n="addProvider">+ 添加服务商</button>
    </div>

    <div class="subcard">
      <div class="subcard-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
        <span data-i18n="cfgPhoneTitle">电话服务商</span>
        <span class="tag" data-i18n="tagReserved">预留</span>
      </div>
      <div id="phone-rows"></div>
      <button id="phone-add" data-i18n="addProvider">+ 添加服务商</button>
    </div>

    <div class="subcard">
      <div class="subcard-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>
        <span data-i18n="cfgFreeTitle">免费用户权益</span>
      </div>
      <div class="form-row">
        <label data-i18n="labelAssetQuota">资产上限</label>
        <input id="cfg-quota" class="md" type="number" min="1">
        <span class="muted" data-i18n="hintQuota">免费档最多可创建的资产数;会员不限</span>
      </div>
    </div>

    <div class="subcard">
      <div class="subcard-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
        <span data-i18n="cfgNotifyTitle">通知额度</span>
        <span class="tag" data-i18n="tagMonthly">每月</span>
      </div>
      <div class="form-row">
        <label data-i18n="labelFreeEmails">免费用户邮件</label>
        <input id="cfg-free-emails" class="md" type="number" min="0">
        <span class="muted" data-i18n="hintFreeEmails">免费用户每月系统邮件额度</span>
      </div>
      <div class="form-row">
        <label data-i18n="labelMemberEmails">会员邮件</label>
        <input id="cfg-member-emails" class="md" type="number" min="0">
        <span class="muted" data-i18n="hintMemberEmails">会员每月系统邮件额度</span>
      </div>
      <div class="form-row">
        <label data-i18n="labelMemberSms">会员短信</label>
        <input id="cfg-member-sms" class="md" type="number" min="0">
        <span class="muted" data-i18n="hintMemberSms">会员每月短信额度</span>
      </div>
    </div>

    <div class="subcard">
      <div class="subcard-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="22 7 13.5 15.5 8.5 10.5 2 17"/><polyline points="16 7 22 7 22 13"/></svg>
        <span data-i18n="cfgLadderTitle">默认触发阶梯</span>
        <span class="tag" data-i18n="tagDays">天</span>
      </div>
      <div class="form-row">
        <label data-i18n="labelLadder">一级 / 二级</label>
        <input id="cfg-ladder-1" class="sm" type="number" min="1" max="3650">
        <span class="muted">,</span>
        <input id="cfg-ladder-2" class="sm" type="number" min="1" max="3650">
        <span class="muted" data-i18n="hintLadder">一级:IM+邮件;二级:一级+短信,跨过二级触发继承</span>
      </div>
    </div>

    <div class="subcard">
      <div class="subcard-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="M9 12l2 2 4-4"/></svg>
        <span data-i18n="cfg2faTitle">管理后台两步验证 (2FA)</span>
      </div>
      <div id="2fa-box" class="muted" data-i18n="loading">加载中...</div>
    </div>

    <div class="save-bar">

var lang = 'zh';
function t(key, params) {
  var s = (I18N[lang] && I18N[lang][key]) || (I18N.zh && I18N.zh[key]) || key;
  if (params) {
    Object.keys(params).forEach(function (k) {
      s = s.split('{' + k + '}').join(params[k]);
    });
  }
  return s;
}
function applyLang() {
  document.getElementById('lang-zh').className = lang === 'zh' ? 'active' : '';
  document.getElementById('lang-en').className = lang === 'en' ? 'active' : '';
  document.querySelectorAll('[data-i18n]').forEach(function (el) {
    var key = el.getAttribute('data-i18n');
    if (I18N[lang] && I18N[lang][key] != null) el.textContent = I18N[lang][key];
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(function (el) {
    var key = el.getAttribute('data-i18n-ph');
    if (I18N[lang] && I18N[lang][key] != null) el.placeholder = I18N[lang][key];
  });
  document.querySelectorAll('[data-i18n-title]').forEach(function (el) {
    var key = el.getAttribute('data-i18n-title');
    if (I18N[lang] && I18N[lang][key] != null) el.title = I18N[lang][key];
  });
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
  try { localStorage.setItem('admin_lang', lang); } catch (e) {}
  if (currentTab) refreshTab();
}
document.getElementById('lang-zh').addEventListener('click', function () { lang = 'zh'; applyLang(); });
document.getElementById('lang-en').addEventListener('click', function () { lang = 'en'; applyLang(); });
// Default from the browser language when no stored preference.
(function () {
  var saved = null;
  try { saved = localStorage.getItem('admin_lang'); } catch (e) {}
  if (saved === 'zh' || saved === 'en') {
    lang = saved;
  } else {
    var nav = (navigator.language || '').toLowerCase();
    if (nav.indexOf('en') === 0) lang = 'en';
  }
  applyLang();
})();

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
// 服务端时间为 UTC('YYYY-MM-DD HH:MM:SS',无时区标记):补 Z 转客户端本地显示。
// 注意:expiry_date 是日历日期(非时间戳),不要用本函数。
function fmtTime(s) {
  if (!s) return '';
  var d = new Date(s.length === 19 ? s.replace(' ', 'T') + 'Z' : s);
  if (isNaN(d.getTime())) return s;
  var p = function (n) { return (n < 10 ? '0' : '') + n; };
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function toast(msg, ok) {
  var el = document.getElementById('msg');
  el.textContent = msg;
  el.className = 'msg show ' + (ok ? 'ok' : 'err');
  clearTimeout(toast._t);
  toast._t = setTimeout(function () { el.className = 'msg'; }, 2600);
}
function api(path, opts) {
  opts = opts || {};
  opts.headers = Object.assign({}, opts.headers || {});
  var token = localStorage.getItem(TOKEN_KEY);
  if (token) opts.headers.Authorization = 'Bearer ' + token;
  if (opts.body) opts.headers['Content-Type'] = 'application/json';
  // Server messages are localized via Accept-Language to match the current UI language.
  opts.headers['Accept-Language'] = lang === 'zh' ? 'zh-CN,zh;q=0.9' : 'en;q=0.9';
  return fetch('/api/v1' + path, opts).then(function (resp) {
    return resp.json().catch(function () { return {}; }).then(function (data) {
      if (resp.status === 401) { logout(); throw new Error(t('sessionExpired')); }
      if (!resp.ok) throw new Error(data.error || ('HTTP ' + resp.status));
      return data;
    });
  });
}
function logout() {
  localStorage.removeItem(TOKEN_KEY);
  document.getElementById('appbar').classList.add('hidden');
  document.getElementById('app').classList.add('hidden');
  document.getElementById('login-view').classList.remove('hidden');
}

/* ---------- login ---------- */
var captcha = { captcha_id: '', image_svg: '' };
function loadCaptcha() {
  return fetch('/api/v1/auth/captcha').then(function (r) { return r.json(); }).then(function (d) {
    captcha = d;
    document.getElementById('lg-question').innerHTML = d.image_svg;
    document.getElementById('lg-captcha').value = '';
  }).catch(function () {
    document.getElementById('lg-question').textContent = t('captchaFail');
  });
}
function enterApp(d) {
  localStorage.setItem(TOKEN_KEY, d.token);
  document.getElementById('who').textContent = d.user.username;
  document.getElementById('login-view').classList.add('hidden');
  document.getElementById('appbar').classList.remove('hidden');
  document.getElementById('app').classList.remove('hidden');
  switchTab('dash');
  loadStats();
}
function doLogin() {
  var u = document.getElementById('lg-user').value.trim();
  var p = document.getElementById('lg-pass').value;
  if (!u || !p) return toast(t('enterCredentials'), false);
  api('/auth/login', {
    method: 'POST',
    body: JSON.stringify({
      username: u, password: p,
      captcha_id: captcha.captcha_id, captcha: document.getElementById('lg-captcha').value.trim().toUpperCase()
    })
  })
    .then(function (d) {
      if (d.totp_required) {
        // 2FA 第二步:切换为动态码输入。
        state.pendingToken = d.pending_token;
        document.getElementById('lg-form').classList.add('hidden');
        document.getElementById('lg-2fa').classList.remove('hidden');
        document.getElementById('lg-totp').focus();
        return;
      }
      if (d.user && d.user.role !== 'admin') throw new Error(t('notAdmin'));
      enterApp(d);
    })
    .catch(function (e) { toast(e.message, false); loadCaptcha(); }); // 验证码一次性,失败即换
}
function verify2FA() {
  var code = document.getElementById('lg-totp').value.trim();
  if (!code) return toast(t('enterTotp'), false);
  api('/auth/2fa/verify', { method: 'POST', body: JSON.stringify({ pending_token: state.pendingToken, code: code }) })
    .then(function (d) { enterApp(d); })
    .catch(function (e) { toast(e.message, false); });
}
loadCaptcha();
document.getElementById('lg-btn').addEventListener('click', doLogin);
document.getElementById('lg-2fa-btn').addEventListener('click', verify2FA);
document.getElementById('lg-pass').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
document.getElementById('lg-captcha').addEventListener('keydown', function (e) { if (e.key === 'Enter') doLogin(); });
document.getElementById('lg-totp').addEventListener('keydown', function (e) { if (e.key === 'Enter') verify2FA(); });
document.getElementById('logout').addEventListener('click', logout);

/* ---------- tabs ---------- */
function switchTab(name) {
  currentTab = name;
  document.querySelectorAll('#tabs button').forEach(function (b) {
    b.classList.toggle('active', b.dataset.tab === name);
  });
  ['dash', 'users', 'config', 'codes', 'audit', 'about'].forEach(function (t) {
    document.getElementById('tab-' + t).classList.toggle('hidden', t !== name);
  });
  if (name === 'dash') loadStats();
  if (name === 'users') loadUsers();
  if (name === 'config') loadConfig();
  if (name === 'codes') loadCodes();
  if (name === 'audit') loadAudit();
  if (name === 'about') loadAbout();
}
document.querySelectorAll('#tabs button').forEach(function (b) {
  b.addEventListener('click', function () { switchTab(b.dataset.tab); });
});

// Re-render the currently visible tab's dynamic content after a language switch.
function refreshTab() {
  if (document.getElementById('app').classList.contains('hidden')) return;
  if (currentTab === 'dash') loadStats();
  else if (currentTab === 'users') loadUsers();
  else if (currentTab === 'config') loadConfig();
  else if (currentTab === 'codes') loadCodes();
  else if (currentTab === 'audit') loadAudit();
  else if (currentTab === 'about') loadAbout();
}

/* ---------- dashboard ---------- */
var STAT_LABELS = {
  users: 'statUsers', members: 'statMembers', admins: 'statAdmins', disabled_users: 'statDisabled',
  assets: 'statAssets', categories: 'statCategories', inheritors: 'statHeirs', pending_inheritance_events: 'statPendingEvents', unread_reminders: 'statUnread'
};
function loadStats() {
  api('/admin/stats').then(function (s) {
    var html = Object.keys(STAT_LABELS).map(function (k) {
      return '<div class="stat"><div class="n">' + esc(s[k] || 0) + '</div><div class="l">' + I18N[lang][STAT_LABELS[k]] + '</div></div>';
    }).join('');
    document.getElementById('stats').innerHTML = html;
  }).catch(function (e) { toast(e.message, false); });
}

/* ---------- users ---------- */
// 分页信息:显示"第 p / 共 T 页 · N 条",并给出总页数供按钮禁用判断。
function pagerInfo(total, page, pageSize) {
  var pages = Math.max(1, Math.ceil(total / pageSize));
  return { text: t('pagerInfo', { p: page, t: pages, n: total }), pages: pages };
}
function loadUsers(page) {
  if (page) state.users.page = page;
  var p = state.users.page;
  var q = encodeURIComponent(state.users.q);
  var role = encodeURIComponent(state.users.role);
  var tier = encodeURIComponent(state.users.tier);
  api('/admin/users?q=' + q + '&role=' + role + '&tier=' + tier + '&page=' + p + '&page_size=20')
    .then(function (d) {
      var rows = d.users.map(function (u) {
        var tierB = u.tier === 'member' ? '<span class="badge member">' + t('bMember') + '</span>' : '<span class="badge free">' + t('bFree') + '</span>';
        var roleB = u.role === 'admin' ? '<span class="badge admin">' + t('bAdmin') + '</span>' : '<span class="badge user">' + t('bUser') + '</span>';
        var stB = u.disabled ? '<span class="badge off">' + t('bDisabled') + '</span>' : '<span class="badge on">' + t('bActive') + '</span>';
        var expB = u.tier === 'member'
          ? (u.member_expires_at ? esc(fmtTime(u.member_expires_at)) : '<span class="badge on">' + t('bPermanent') + '</span>')
          : '<span class="muted">—</span>';
        return '<tr><td>' + u.id + '</td><td>' + esc(u.username) + '</td><td>' + esc(u.email) + '</td>' +
          '<td>' + tierB + '</td><td>' + expB + '</td><td>' + roleB + '</td><td>' + stB + '</td>' +
          '<td>' + u.asset_count + '</td><td>' + u.inheritor_count + '</td>' +
          '<td>' + esc(fmtTime(u.last_login_at)) + '</td><td>' + esc(fmtTime(u.created_at)) + '</td>' +
          '<td>' + userActions(u) + '</td></tr>';
      }).join('');
      document.getElementById('u-body').innerHTML = rows || '<tr><td colspan="12" class="muted">' + t('noUsers') + '</td></tr>';
      var pi = pagerInfo(d.total, d.page, d.page_size || 20);
      document.getElementById('u-info').textContent = pi.text;
      document.getElementById('u-prev').disabled = d.page <= 1;
      document.getElementById('u-next').disabled = d.page >= pi.pages;
    })
    .catch(function (e) { toast(e.message, false); });
}
function userActions(u) {
  var a = [];
  if (u.tier !== 'member') a.push('<button data-act="member" data-id="' + u.id + '">' + t('actMember') + '</button>');
  else a.push('<button data-act="unmember" data-id="' + u.id + '">' + t('actUnmember') + '</button>');
  if (u.role !== 'admin') a.push('<button data-act="admin" data-id="' + u.id + '">' + t('actAdmin') + '</button>');
  else a.push('<button data-act="unadmin" data-id="' + u.id + '">' + t('actUnadmin') + '</button>');
  if (!u.disabled) a.push('<button data-act="disable" data-id="' + u.id + '">' + t('actDisable') + '</button>');
  else a.push('<button data-act="enable" data-id="' + u.id + '">' + t('actEnable') + '</button>');
  a.push('<button class="danger" data-act="del" data-id="' + u.id + '">' + t('actDelete') + '</button>');
  return a.join(' ');
}
document.getElementById('u-body').addEventListener('click', function (e) {
  var btn = e.target.closest('button[data-act]');
  if (!btn) return;
  var id = btn.dataset.id, act = btn.dataset.act;
  var body = null;
  if (act === 'member') body = { tier: 'member' };
  if (act === 'unmember') body = { tier: 'free' };
  if (act === 'admin') body = { role: 'admin' };
  if (act === 'unadmin') body = { role: 'user' };
  if (act === 'disable') body = { disabled: true };
  if (act === 'enable') body = { disabled: false };
  if (act === 'del' && !confirm(t('confirmDelUser', { id: id }))) return;
  var req = body ? { method: 'PUT', body: JSON.stringify(body) } : { method: 'DELETE' };
  api('/admin/users/' + id, req).then(function () {
    toast(act === 'del' ? t('toastDel') : t('toastUpdated'), true);
    loadUsers();
  }).catch(function (er) { toast(er.message, false); });
});
function setUserFilter() {
  state.users.q = document.getElementById('u-q').value.trim();
  state.users.role = document.getElementById('u-role').value;
  state.users.tier = document.getElementById('u-tier').value;
  state.users.page = 1;
  loadUsers();
}
document.getElementById('u-search').addEventListener('click', setUserFilter);
['u-q', 'u-role', 'u-tier'].forEach(function (id) {
  document.getElementById(id).addEventListener('change', setUserFilter);
});
document.getElementById('u-prev').addEventListener('click', function () { loadUsers(state.users.page - 1); });
document.getElementById('u-next').addEventListener('click', function () { loadUsers(state.users.page + 1); });

/* ---------- config ---------- */
function smtpRow(s, hasPass) {
  s = s || {};
  var passNote = hasPass ? '<span class="muted">' + t('smtpPassNote') + '</span>' : '';
  var row = document.createElement('div');
  row.className = 'form-row';
  row.innerHTML =
    '<input class="md" placeholder="host" value="' + esc(s.host || '') + '">' +
    '<input class="sm" type="number" placeholder="port" value="' + esc(s.port || '') + '">' +
    '<input class="md" placeholder="user" value="' + esc(s.user || '') + '">' +
    '<input class="md" type="password" placeholder="password" value="">' + passNote +
    '<input class="md" placeholder="from_addr" value="' + esc(s.from_addr || '') + '">' +
    '<button type="button">' + t('removeBtn') + '</button>';
  return row;
}
function loadConfig() {
  api('/admin/config').then(function (c) {
    var wrap = document.getElementById('smtp-rows');
    wrap.innerHTML = '';
    (c.smtp_servers || []).forEach(function (s) { wrap.appendChild(smtpRow(s, s.password_set)); });
    if (!c.smtp_servers.length) wrap.appendChild(smtpRow());
    ['sms', 'phone'].forEach(function (kind) {
      var box = document.getElementById(kind + '-rows');
      box.innerHTML = '';
      (c[kind + '_providers'] || []).forEach(function (p) { box.appendChild(providerRow(p)); });
      if (!c[kind + '_providers'].length) box.appendChild(providerRow());
    });
    document.getElementById('cfg-quota').value = c.free_asset_quota;
    document.getElementById('cfg-free-emails').value = c.free_monthly_emails;
    document.getElementById('cfg-member-emails').value = c.member_monthly_emails;
    document.getElementById('cfg-member-sms').value = c.member_monthly_sms;
    var ld = c.default_ladder_days || [15, 60];
    document.getElementById('cfg-ladder-1').value = ld[0];
    document.getElementById('cfg-ladder-2').value = ld[1];
  }).catch(function (e) { toast(e.message, false); });
  load2FA();
}
function providerRow(p) {
  p = p || {};
  var keyNote = p.api_key_set ? '<span class="muted">' + t('setNote') + '</span>' : '';
  var secNote = p.api_secret_set ? '<span class="muted">' + t('setNote') + '</span>' : '';
  var row = document.createElement('div');
  row.className = 'form-row';
  row.innerHTML =
    '<input class="md" placeholder="name" value="' + esc(p.name || '') + '">' +
    '<input class="md" type="password" placeholder="' + t('phApiKey') + '" value="">' + keyNote +
    '<input class="md" type="password" placeholder="' + t('phApiSecret') + '" value="">' + secNote +
    '<button type="button">' + t('removeBtn') + '</button>';
  return row;
}
function collectRows(boxId) {
  return Array.prototype.map.call(document.querySelectorAll('#' + boxId + ' .form-row'), function (row) {
    var inp = row.querySelectorAll('input');
    return { host: inp[0].value.trim(), port: parseInt(inp[1].value, 10) || 0, user: inp[2].value.trim(), password: inp[3].value, from_addr: inp[4].value.trim() };
  });
}
function collectProviders(boxId) {
  return Array.prototype.map.call(document.querySelectorAll('#' + boxId + ' .form-row'), function (row) {
    var inp = row.querySelectorAll('input');
    return { name: inp[0].value.trim(), api_key: inp[1].value, api_secret: inp[2].value };
  });
}
document.getElementById('smtp-add').addEventListener('click', function () {
  document.getElementById('smtp-rows').appendChild(smtpRow());
});
document.getElementById('sms-add').addEventListener('click', function () {
  document.getElementById('sms-rows').appendChild(providerRow());
});
document.getElementById('phone-add').addEventListener('click', function () {
  document.getElementById('phone-rows').appendChild(providerRow());
});
document.querySelectorAll('#smtp-rows, #sms-rows, #phone-rows').forEach(function (box) {
  box.addEventListener('click', function (e) {
    if (e.target.textContent === t('removeBtn')) e.target.closest('.form-row').remove();
  });
});
document.getElementById('cfg-save').addEventListener('click', function () {
  api('/admin/config', {
    method: 'PUT',
    body: JSON.stringify({
      smtp_servers: collectRows('smtp-rows'),
      sms_providers: collectProviders('sms-rows'),
      phone_providers: collectProviders('phone-rows'),
      free_asset_quota: parseInt(document.getElementById('cfg-quota').value, 10) || 0,
      free_monthly_emails: parseInt(document.getElementById('cfg-free-emails').value, 10) || 0,
      member_monthly_emails: parseInt(document.getElementById('cfg-member-emails').value, 10) || 0,
      member_monthly_sms: parseInt(document.getElementById('cfg-member-sms').value, 10) || 0,
      default_ladder_days: [
        parseInt(document.getElementById('cfg-ladder-1').value, 10) || 0,
        parseInt(document.getElementById('cfg-ladder-2').value, 10) || 0
      ]
    })
  })
    .then(function () { toast(t('configSavedToast'), true); loadConfig(); })
    .catch(function (e) { toast(e.message, false); });
});

/* ---------- 2FA ---------- */
function load2FA() {
  api('/admin/2fa').then(function (s) {
    var box = document.getElementById('2fa-box');
    box.innerHTML = '';
    if (s.enabled) {
      box.innerHTML =
        '<span class="badge on">' + t('bEnabled') + '</span> ' +
        '<span class="muted">' + t('twofaEnabledNote') + '</span>' +
        '<div class="form-row" style="margin-top:10px"><input id="2fa-off-code" class="md" placeholder="' + t('phCurrentCode') + '" inputmode="numeric" maxlength="6">' +
        '<button class="danger" id="2fa-off-btn">' + t('btnOff2fa') + '</button></div>';
      document.getElementById('2fa-off-btn').addEventListener('click', function () {
        var code = document.getElementById('2fa-off-code').value.trim();
        if (!code) return toast(t('enterTotp'), false);
        api('/admin/2fa/disable', { method: 'POST', body: JSON.stringify({ code: code }) })
          .then(function () { toast(t('twofaOffToast'), true); load2FA(); })
          .catch(function (e) { toast(e.message, false); });
      });
    } else {
      box.innerHTML = '<span class="badge off">' + t('bOff') + '</span> ' +
        '<button id="2fa-on-btn" style="margin-left:8px">' + t('btnOn2fa') + '</button>';
      document.getElementById('2fa-on-btn').addEventListener('click', function () {
        api('/admin/2fa/setup', { method: 'POST' }).then(function (d) {
          box.innerHTML =
            '<div class="muted" style="margin-bottom:8px">' + t('twofaManualIntro') + ' <code>' + esc(d.secret) + '</code></div>' +
            '<div class="muted" style="margin-bottom:8px;word-break:break-all">' + esc(d.otpauth_uri) + '</div>' +
            '<div class="form-row"><input id="2fa-on-code" class="md" placeholder="' + t('phVerifierCode') + '" inputmode="numeric" maxlength="6">' +
            '<button class="primary" id="2fa-on-confirm">' + t('btnConfirm2fa') + '</button></div>';
          document.getElementById('2fa-on-confirm').addEventListener('click', function () {
            var code = document.getElementById('2fa-on-code').value.trim();
            if (!code) return toast(t('enterTotp'), false);
            api('/admin/2fa/confirm', { method: 'POST', body: JSON.stringify({ secret: d.secret, code: code }) })
              .then(function () { toast(t('twofaOnToast'), true); load2FA(); })
              .catch(function (e) { toast(e.message, false); });
          });
        }).catch(function (e) { toast(e.message, false); });
      });
    }
  }).catch(function (e) { toast(e.message, false); });
}

/* ---------- 兑换码 ---------- */
var RC_PAGE_SIZE = 20;
function loadCodes(page) {
  if (page) state.codes.page = page;
  var p = state.codes.page;
  api('/admin/redemption-codes?page=' + p + '&page_size=' + RC_PAGE_SIZE).then(function (d) {
    var rows = d.items.map(function (c) {
      var stB = c.used_by ? '<span class="badge off">' + t('bUsed') + '</span>' : '<span class="badge on">' + t('bUnused') + '</span>';
      var del = c.used_by ? '' : '<button class="danger" data-del="' + c.id + '">' + t('actDelete') + '</button>';
      return '<tr><td>' + c.id + '</td><td><code>' + esc(c.code) + '</code></td><td>' + c.duration_days + '</td>' +
        '<td>' + esc(c.used_by_username || c.used_by || '') + '</td><td>' + esc(fmtTime(c.used_at)) + '</td><td>' + esc(fmtTime(c.created_at)) + '</td>' +
        '<td>' + stB + ' ' + del + '</td></tr>';
    }).join('');
    document.getElementById('rc-body').innerHTML = rows || '<tr><td colspan="7" class="muted">' + t('noCodes') + '</td></tr>';
    var pi = pagerInfo(d.total, d.page, RC_PAGE_SIZE);
    document.getElementById('rc-info').textContent = pi.text;
    document.getElementById('rc-prev').disabled = d.page <= 1;
    document.getElementById('rc-next').disabled = d.page >= pi.pages;
  }).catch(function (e) { toast(e.message, false); });
}
document.getElementById('rc-prev').addEventListener('click', function () { loadCodes(state.codes.page - 1); });
document.getElementById('rc-next').addEventListener('click', function () { loadCodes(state.codes.page + 1); });
document.getElementById('rc-gen').addEventListener('click', function () {
  var count = parseInt(document.getElementById('rc-count').value, 10) || 0;
  var days = parseInt(document.getElementById('rc-days').value, 10) || 0;
  api('/admin/redemption-codes', { method: 'POST', body: JSON.stringify({ count: count, duration_days: days }) })
    .then(function (d) {
      document.getElementById('rc-result').innerHTML = t('rcGenerated', { n: d.codes.length }) + '<br>' + d.codes.map(esc).join('<br>');
      toast(t('rcGenToast'), true);
      loadCodes();
    }).catch(function (e) { toast(e.message, false); });
});
document.getElementById('rc-body').addEventListener('click', function (e) {
  var btn = e.target.closest('button[data-del]');
  if (!btn) return;
  var id = btn.dataset.del;
  if (!confirm(t('confirmDelCode', { id: id }))) return;
  api('/admin/redemption-codes/' + id, { method: 'DELETE' })
    .then(function () { toast(t('toastDel'), true); loadCodes(); })
    .catch(function (e) { toast(e.message, false); });
});

/* ---------- audit ---------- */
function loadAudit(page) {
  if (page) state.audit.page = page;
  var p = state.audit.page;
  var uid = encodeURIComponent(state.audit.uid);
  var from = encodeURIComponent(state.audit.from);
  var to = encodeURIComponent(state.audit.to);
  api('/admin/audit-log?user_id=' + uid + '&from=' + from + '&to=' + to + '&page=' + p + '&page_size=50')
    .then(function (d) {
      var rows = d.entries.map(function (e) {
        return '<tr><td>' + e.id + '</td><td>' + e.user_id + '</td><td>' + esc(e.actor) + '</td>' +
          '<td>' + esc(e.action) + '</td><td>' + esc(e.detail) + '</td><td>' + esc(fmtTime(e.created_at)) + '</td></tr>';
      }).join('');
      document.getElementById('a-body').innerHTML = rows || '<tr><td colspan="6" class="muted">' + t('noRecords') + '</td></tr>';
      var pi = pagerInfo(d.total, d.page, d.page_size || 50);
      document.getElementById('a-info').textContent = pi.text;
      document.getElementById('a-prev').disabled = d.page <= 1;
      document.getElementById('a-next').disabled = d.page >= pi.pages;
    })
    .catch(function (e) { toast(e.message, false); });
}
document.getElementById('a-search').addEventListener('click', function () {
  state.audit.uid = document.getElementById('a-uid').value.trim();
  state.audit.from = document.getElementById('a-from').value;
  state.audit.to = document.getElementById('a-to').value;
  state.audit.page = 1;
  loadAudit();
});
document.getElementById('a-reset').addEventListener('click', function () {
  ['a-uid', 'a-from', 'a-to'].forEach(function (id) { document.getElementById(id).value = ''; });
  state.audit.uid = state.audit.from = state.audit.to = '';
  state.audit.page = 1;
  loadAudit();
});
document.getElementById('a-prev').addEventListener('click', function () { loadAudit(state.audit.page - 1); });
document.getElementById('a-next').addEventListener('click', function () { loadAudit(state.audit.page + 1); });

// 导出审计日志 CSV(原始 fetch,响应是文件而非 JSON)。
document.getElementById('a-export').addEventListener('click', function () {
  var uid = encodeURIComponent(state.audit.uid);
  fetch('/api/v1/admin/audit-log/export?user_id=' + uid, {
    headers: { Authorization: 'Bearer ' + localStorage.getItem(TOKEN_KEY) }
  }).then(function (resp) {
    if (!resp.ok) throw new Error(t('exportFail'));
    return resp.blob();
  }).then(function (blob) {
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'audit-log.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  }).catch(function (e) { toast(e.message, false); });
});

/* ---------- about ---------- */
function aboutBox(ver) {
  return '<p style="font-size:15px;font-weight:600;color:#1f2328">' + t('aboutBrand') + '</p>' +
    '<p style="margin:8px 0">' + t('aboutDesc') + '</p>' +
    '<p style="margin:8px 0">' + t('aboutVersion') + ' <code>' + esc(ver || 'dev') + '</code></p>' +
    '<p style="margin:8px 0">GitHub: <a href="https://github.com/muxinxy/bequest" target="_blank" rel="noopener">https://github.com/muxinxy/bequest</a></p>';
}
function loadAbout() {
  var box = document.getElementById('about-box');
  box.innerHTML = t('loading');
  fetch('/api/v1/version').then(function (r) { return r.json(); }).then(function (d) {
    box.innerHTML = aboutBox(d.version);
  }).catch(function () {
    box.innerHTML = aboutBox('dev');
  });
}
</script>
